<!doctype html>
<html lang="en">
<head>

<title>Become a Host / Influencer for Brand Collaborations | BeGrow</title>
<style>
:root{--bg:#050403;--gold:#d7aa32;--gold2:#fff0a1;--pink:#e83e9a;--line:rgba(226,190,83,.2);--muted:#a79f8d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#f7f3e8;font-family:Inter,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 75% 5%,rgba(228,184,61,.12),transparent 30%),linear-gradient(180deg,#090702,#020201)}
.header{min-height:72px;padding:10px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(5,4,3,.92);position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.logo-m{width:38px;height:38px;border:1px solid var(--gold);border-radius:11px;display:grid;place-items:center;color:var(--gold2);font:22px Georgia,serif}.logo b{display:block;font:700 15px Georgia,serif;letter-spacing:.15em}.logo small{display:block;color:#8e866f;font-size:7px;letter-spacing:.23em;margin-top:2px}.back{font-size:12px;color:#ddd4bf;text-decoration:underline;text-underline-offset:4px}
.wrap{width:min(820px,calc(100% - 30px));margin:auto}.form-section{padding:35px 0 80px}.form-card{padding:25px;border:1px solid rgba(228,184,61,.28);border-radius:24px;background:linear-gradient(145deg,rgba(39,29,10,.82),rgba(8,6,3,.97));box-shadow:0 28px 90px rgba(0,0,0,.55),0 0 55px rgba(228,184,61,.07)}
.form-title{text-align:center;margin-bottom:22px}.kicker{color:#fff0a1;font-size:9px;font-weight:900;letter-spacing:.2em}.form-title h1{font:700 46px/1 Georgia,serif;margin:9px 0}.form-title p{color:var(--muted);font-size:11px}
label{display:block;color:#e9e1cf;font-size:11px;font-weight:850;margin-bottom:15px}input,select,textarea{width:100%;margin-top:7px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#050403;color:#fff;font:inherit;font-size:12px;outline:none}input:focus,select:focus,textarea:focus{border-color:#d7aa32;box-shadow:0 0 0 2px rgba(215,170,50,.08)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.phone-row{display:grid;grid-template-columns:170px 1fr;gap:8px}
.submit{width:100%;border:1px solid rgba(255,239,154,.92);border-radius:13px;padding:15px;cursor:pointer;font-weight:950;font-size:12px;color:#241700;background:linear-gradient(135deg,#a97810 0%,#d9aa32 24%,#fff0a1 48%,#d9aa32 70%,#a97810 100%);box-shadow:0 10px 30px rgba(215,170,50,.28),inset 0 1px 0 rgba(255,255,255,.5);position:relative;overflow:hidden}.submit:before{content:"";position:absolute;top:-30%;left:-45%;width:35%;height:160%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.78),transparent);animation:submitGoldShine 3s ease-in-out infinite}.submit{isolation:isolate}.submit::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 18px rgba(255,220,95,.18);pointer-events:none}@keyframes submitGoldShine{0%{left:-45%}55%,100%{left:120%}}
.error,.success{display:none;padding:12px;border-radius:12px;margin-bottom:14px;font-size:11px}.error{background:rgba(255,80,80,.07);border:1px solid rgba(255,80,80,.2);color:#ffb9b9}.success{background:rgba(228,184,61,.08);border:1px solid rgba(228,184,61,.25);color:#fff0a1}.show{display:block}
@media(max-width:600px){.header{padding:10px 15px}.form-card{padding:18px}.form-title h1{font-size:40px}.two,.phone-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header">
<a class="logo" href="index.html"><span class="logo-m">M</span><span><b>MERLIN</b><small>AGENCY</small></span></a>
<a class="back" href="index.html">← Back to Website</a>
</header>
<main><section class="form-section wrap"><div class="form-card">
<div class="form-title"><span class="kicker">CREATOR APPLICATION</span><h1>Join as Influencer</h1><p>Submit your details to register as a Merlin Agency influencer.</p></div>
<div id="error" class="error"></div><div id="success" class="success">✓ Application prepared. Opening WhatsApp…</div>
<form id="applyForm" novalidate>
<div class="two">
<label>Full Name<input name="name" required placeholder="Your full name"></label>
<label>Age<input name="age" type="number" min="18" required placeholder="Your age"></label>
</div>
<label>Influencer Country<select name="influencerCountry" id="influencerCountry" required><option value="" selected disabled>Select your country</option></select></label>
<div class="two">
<label>Email Address<input name="email" type="email" required placeholder="you@example.com"></label>
<label>WhatsApp Number<div class="phone-row"><select name="countryCode" id="countryCode" required></select><input name="phone" required placeholder="WhatsApp number" inputmode="tel"></div></label>
</div>
<label>Instagram ID<input name="instagram" required placeholder="@yourusername"></label>
<label>Instagram Followers<select name="followers" required><option value="" selected disabled>Select follower range</option><option>1K – 5K</option><option>5K – 10K</option><option>10K – 25K</option><option>25K – 50K</option><option>50K – 100K</option><option>100K – 500K</option><option>500K+</option></select></label>
<label>Content Category<select name="category" required><option value="" selected disabled>Select category</option><option>Fashion & Beauty</option><option>Lifestyle</option><option>Entertainment</option><option>Food</option><option>Travel</option><option>Fitness</option><option>Gaming</option><option>Tech</option><option>Education</option><option>Other</option></select></label>
<label>Influencer Intro Video (10 Seconds • Google Drive Link)<input name="introVideo" type="url" required placeholder="Paste your 10-second Google Drive video link" autocomplete="url"><small style="display:block;margin-top:6px;color:#a79f8d;font-size:9px;font-weight:600">Upload a 10-second influencer intro video and make sure the Google Drive link is accessible for viewing.</small></label>
<label>About You / Content Details<textarea name="about" maxlength="500" required placeholder="Tell us briefly about your content and audience."></textarea></label>
<button class="submit" type="submit">Join as Influencer ↗</button>
</form></div></section></main>

</body></html>
