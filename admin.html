<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#06110b">
<title>Become a Host / Influencer for Brand Collaborations | BeGrow</title>
<style>
:root{--bg:#020705;--panel:#07120c;--green:#e4b83d;--green2:#fff0a1;--text:#f1f8f3;--muted:#8fa197;--line:rgba(255,239,150,.16)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,rgba(228,184,61,.09),transparent 30%),var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}button,input{font:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto}.login{max-width:420px;margin:8vh auto;padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(12,37,24,.9),rgba(4,11,7,.96));box-shadow:0 24px 80px rgba(0,0,0,.45)}.brand{display:flex;align-items:center;gap:10px}.mark{width:40px;height:40px;border:1px solid var(--green);border-radius:11px;display:grid;place-items:center;color:var(--green);font:23px Georgia}.brand b{display:block;letter-spacing:.14em;font:700 14px Georgia}.brand small{color:#769082;letter-spacing:.2em;font-size:7px}h1,h2{font-family:Georgia,serif}.login h1{margin:22px 0 8px;font-size:34px}.login p{color:var(--muted);font-size:12px;line-height:1.6}.field{margin:14px 0}.field label{display:block;color:#a9b9af;font-size:10px;font-weight:800;margin-bottom:6px}.field input{width:100%;background:#020805;border:1px solid var(--line);border-radius:12px;padding:13px;color:white;outline:none}.field input:focus{border-color:var(--green)}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:var(--green);color:#031108;font-weight:900;cursor:pointer;margin-top:5px}.primary:disabled{opacity:.6;cursor:wait}.error{display:none;color:#ffb0b0;font-size:11px;line-height:1.6;margin-top:12px;padding:11px;border-radius:10px;background:rgba(255,80,80,.07);border:1px solid rgba(255,120,120,.18);word-break:break-word}.error.show{display:block}.status{font-size:10px;color:var(--muted);margin-top:10px}.status.ok{color:var(--green2)}.dashboard{display:none}.dashboard.open{display:block}.top{padding:16px 0;border-bottom:1px solid var(--line)}.top-inner{display:flex;justify-content:space-between;align-items:center;gap:12px}.logout{background:transparent;border:1px solid var(--line);color:var(--green2);padding:9px 13px;border-radius:999px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(7,18,12,.85)}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{display:block;color:var(--green);font-size:25px;margin-top:5px}.layout{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px}.panel{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(9,27,17,.9),rgba(3,9,6,.95));overflow:hidden}.panel-head{padding:15px 17px;border-bottom:1px solid var(--line);font-weight:900}.apps{max-height:650px;overflow:auto}.app{padding:15px 17px;border-bottom:1px solid rgba(255,239,150,.08);cursor:pointer}.app:hover,.app.active{background:rgba(228,184,61,.07)}.app b{font-size:13px}.app small{display:block;color:var(--muted);margin-top:5px;font-size:10px}.tag{display:inline-block;margin-top:7px;color:var(--green2);font-size:9px;border:1px solid var(--line);padding:4px 7px;border-radius:999px}.empty{padding:25px;color:var(--muted);font-size:12px}.detail{padding:18px}.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px}.info{background:#020805;border:1px solid rgba(255,239,150,.09);border-radius:12px;padding:11px}.info small{display:block;color:#6f8177;font-size:8px;text-transform:uppercase}.info b{display:block;font-size:11px;margin-top:4px;word-break:break-word}.phone{color:var(--green2);font-size:11px}.application-message{margin:10px 0 16px;padding:12px;border-radius:12px;background:rgba(228,184,61,.05);border:1px solid var(--line);color:#b8c8bf;font-size:11px;line-height:1.5}.chat{border-top:1px solid var(--line);margin:0 -18px -18px}.messages{height:340px;overflow:auto;padding:15px}.msg{max-width:82%;padding:10px 12px;border-radius:14px;margin-bottom:9px;font-size:12px;line-height:1.45;white-space:pre-wrap}.msg.user{margin-left:auto;background:var(--green);color:#031108}.msg.agency{background:#0b1a11;border:1px solid var(--line)}.send{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.send input{flex:1;min-width:0;background:#020805;border:1px solid var(--line);border-radius:11px;padding:12px;color:white;outline:none}.send button{border:0;border-radius:11px;background:var(--green);color:#031108;font-weight:900;padding:0 18px;cursor:pointer}.send button:disabled{opacity:.6}.selected-title{margin:0 0 12px;font-size:24px}@media(max-width:850px){.layout{grid-template-columns:1fr}.apps{max-height:360px}}@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.login{margin:7vh auto}.detail{padding:14px}.chat{margin:0 -14px -14px}.messages{height:320px}}
</style>
</head>
<body>
<div id="loginView" class="wrap login">
  <div class="brand"><span class="mark">M</span><span><b>MERLIN</b><small>AGENCY ADMIN</small></span></div>
  <h1>Admin Login</h1>
  <p>Private dashboard for Merlin Agency applications and live chat.</p>
  <div class="field"><label>ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" placeholder="admin@email.com"></div>
  <div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div>
  <button id="loginBtn" class="primary" type="button">Login to Admin Panel</button>
  <div id="loginError" class="error"></div>
  <div id="firebaseStatus" class="status">Connecting to Firebase…</div>
</div>

<div id="dashboard" class="dashboard">
<header class="top"><div class="wrap top-inner"><div class="brand"><span class="mark">M</span><span><b>MERLIN</b><small>AGENCY ADMIN</small></span></div><button id="logout" class="logout" type="button">Logout</button></div></header>
<main class="wrap">
  <div class="stats">
    <div class="stat"><small>APPLICATIONS</small><b id="appCount">0</b></div>
    <div class="stat"><small>MESSAGES</small><b id="chatCount">0</b></div>
    <div class="stat"><small>SELECTED</small><b id="selectedStatus">—</b></div>
  </div>
  <div class="layout">
    <section class="panel"><div class="panel-head">📨 Applications</div><div id="apps" class="apps"><div class="empty">Login to load applications…</div></div></section>
    <section class="panel"><div id="detail" class="detail"><div class="empty">Select an application to view details and live chat.</div></div></section>
  </div>
</main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, onChildAdded, push, off } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCnwNpsliuNJdgSoWFxP0Axqh5P8yVisKA",
  authDomain: "merlin-live-chat.firebaseapp.com",
  databaseURL: "https://merlin-live-chat-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "merlin-live-chat",
  storageBucket: "merlin-live-chat.firebasestorage.app",
  messagingSenderId: "660028612124",
  appId: "1:660028612124:web:37060b488ed47a0e6889d9",
  measurementId: "G-3KHQQ75V6D"
};

const $ = id => document.getElementById(id);
let db, auth, applications = {}, selectedId = null, currentMessagesRef = null, rootListenerStarted = false;

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function showError(message, code=""){
  $("loginError").innerHTML = "<b>Login failed</b><br>" + esc(message) + (code ? "<br><small>" + esc(code) + "</small>" : "");
  $("loginError").classList.add("show");
}
function showLogin(){ $("dashboard").classList.remove("open"); $("loginView").style.display="block"; }
function showDashboard(){ $("loginView").style.display="none"; $("dashboard").classList.add("open"); }

try{
  const app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  auth = getAuth(app);
  $("firebaseStatus").textContent = "Firebase connected";
  $("firebaseStatus").className = "status ok";
}catch(error){
  $("firebaseStatus").textContent = "Firebase setup error";
  showError(error.message || "Firebase could not initialize.");
}

$("loginBtn").addEventListener("click", async () => {
  $("loginError").classList.remove("show");
  const email = $("email").value.trim(), password = $("password").value;
  if(!email || !password){ showError("Please enter both email and password."); return; }
  if(!auth){ showError("Firebase is not initialized. Refresh the page and try again."); return; }
  $("loginBtn").disabled = true; $("loginBtn").textContent = "Signing in…";
  try{ await signInWithEmailAndPassword(auth, email, password); }
  catch(error){
    let message = error.message || "Login failed.";
    if(error.code === "auth/invalid-credential" || error.code === "auth/wrong-password") message = "Email ya password galat hai.";
    else if(error.code === "auth/user-not-found") message = "Is email ka Firebase user nahi mila.";
    else if(error.code === "auth/operation-not-allowed") message = "Firebase Authentication me Email/Password sign-in enable nahi hai.";
    else if(error.code === "auth/invalid-api-key" || error.code === "auth/api-key-not-valid") message = "Firebase API key invalid hai. Firebase Web App config check karo.";
    showError(message, error.code || "unknown-error");
    console.error(error);
  }finally{ $("loginBtn").disabled=false; $("loginBtn").textContent="Login to Admin Panel"; }
});
$("password").addEventListener("keydown", e => { if(e.key === "Enter") $("loginBtn").click(); });
$("logout").addEventListener("click", () => signOut(auth));
onAuthStateChanged(auth, user => { if(user){ showDashboard(); startApplications(); } else showLogin(); });

/* Real-time application watcher.
   The previous version skipped every "messages" branch. That could hide a
   newly-created application when its application record lives beside chat data.
   This version scans all objects but only stores records that look like actual
   applications, while never treating individual chat messages as applications.
*/
function startApplications(){
  if(rootListenerStarted) return;
  rootListenerStarted = true;

  // apply.html stores each application ONLY as:
  // chats/{chatId}/messages/{messageId}
  // with type:"application".
  onValue(ref(db,"/chats"), snapshot => {
    const chats = snapshot.val() || {};
    applications = {};

    Object.entries(chats).forEach(([chatId, chat]) => {
      if(!chat || typeof chat !== "object" || !chat.messages) return;

      let applicationMessage = null;
      let userMessages = 0;
      let latestTime = 0;

      Object.values(chat.messages).forEach(message => {
        if(!message || typeof message !== "object") return;

        const t = Number(message.time) || 0;
        if(t > latestTime) latestTime = t;

        if(message.sender === "user") userMessages++;

        if(message.type === "application" && message.text) {
          if(!applicationMessage || t > (Number(applicationMessage.time)||0)) {
            applicationMessage = message;
          }
        }
      });

      if(!applicationMessage) return;

      const text = String(applicationMessage.text || "");
      if(!text.includes("NEW HOST APPLICATION")) return;

      const field = label => {
        const labels = ["Name","WhatsApp","BIGO ID","City / State","Experience","Preferred Target","Message"];
        const escaped = labels.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|");
        const re = new RegExp(
          "\\n\\s*" + label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") +
          "\\s*:\\s*([\\s\\S]*?)(?=\\n\\s*(?:" + escaped + ")\\s*:|$)","i"
        );
        const m = text.match(re);
        return m ? m[1].trim() : "";
      };

      applications[chatId] = {
        _id: chatId,
        _chatId: chatId,
        name: field("Name"),
        phone: field("WhatsApp"),
        bigoId: field("BIGO ID"),
        location: field("City / State"),
        experience: field("Experience"),
        target: field("Preferred Target"),
        message: field("Message"),
        createdAt: Number(applicationMessage.time)||0,
        lastMessageTime: latestTime,
        userMessageCount: userMessages
      };
    });

    renderApplications();
    if(selectedId && applications[selectedId]) updateSelectedMessageCount(selectedId);
  }, error => {
    console.error("Chats read error", error);
    $("apps").innerHTML='<div class="empty">Database access error. Firebase Realtime Database Rules check karo.</div>';
  });
}

function renderApplications(){
  const ids=Object.keys(applications).sort((a,b)=>
    (Number(applications[b].lastMessageTime)||Number(applications[b].createdAt)||0)-
    (Number(applications[a].lastMessageTime)||Number(applications[a].createdAt)||0)
  );

  $("appCount").textContent=ids.length;

  if(!ids.length){
    $("apps").innerHTML='<div class="empty">No applications found in this Firebase database.</div>';
    return;
  }

  $("apps").innerHTML=ids.map(id=>{
    const a=applications[id];
    const hasUserMessages=Number(a.userMessageCount)>0;
    return `<div class="app ${id===selectedId?"active":""}" data-id="${esc(id)}">
      ${hasUserMessages?'<span class="new-dot"></span>':''}
      <b>${esc(a.name||"Unknown applicant")}</b>
      <small>📍 ${esc(a.location||"—")} · 📱 ${esc(a.phone||"—")}</small>
      <span class="tag">${esc(a.target||"Application")}</span>
    </div>`;
  }).join("");

  $("apps").querySelectorAll(".app").forEach(x=>
    x.addEventListener("click",()=>selectApplication(x.dataset.id))
  );
}

function updateSelectedMessageCount(id){
  const a=applications[id];
  if(!a)return;
  const count=Number(a.userMessageCount)||0;
  $("chatCount").textContent=String(count);
  const stat=$("selectedMsgStat");
  if(stat) stat.textContent=String(count);
}

function selectApplication(id){
  selectedId=id;
  const a=applications[id];
  if(!a) return;

  $("selectedStatus").textContent=a.name||"—";
  $("apps").querySelectorAll(".app").forEach(item =>
    item.classList.toggle("active",item.dataset.id===id)
  );

  $("detail").innerHTML=`
    <h2 class="selected-title">${esc(a.name||"Applicant")}</h2>
    <div class="phone">📱 ${esc(a.phone||a.whatsapp||"Not provided")}</div>

    <div class="detail-grid" style="margin-top:15px">
      <div class="info"><small>BIGO ID</small><b>${esc(a.bigoId||"Not provided")}</b></div>
      <div class="info"><small>LOCATION</small><b>${esc(a.location||"—")}</b></div>
      <div class="info"><small>EXPERIENCE</small><b>${esc(a.experience||"—")}</b></div>
      <div class="info"><small>TARGET</small><b>${esc(a.target||"—")}</b></div>
      <div class="info"><small>CONTACT TIME</small><b>${esc(a.contactTime||"Not specified")}</b></div>
      <div class="info"><small>APPLICATION ID</small><b>${esc(a._chatId||a._id||"—")}</b></div>
      <div class="info"><small>USER MESSAGES</small><b id="selectedMsgStat">${esc(a.userMessageCount||0)}</b></div>
    </div>

    <div class="application-message">
      <b>Application message:</b><br>${esc(a.message||"None")}
    </div>

    <div class="chat">
      <div class="panel-head">💬 Live Chat</div>
      <div id="messages" class="messages"><div class="empty">Loading messages…</div></div>
      <form id="sendForm" class="send">
        <input id="replyInput" required placeholder="Reply to applicant…" autocomplete="off">
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </div>`;

  const chatId = a._chatId || a.chatId || a._id;
  loadMessages(chatId);

  $("sendForm").addEventListener("submit", async e => {
    e.preventDefault();

    const input=$("replyInput"),button=$("sendBtn"),text=input.value.trim();
    if(!text || !chatId) return;

    button.disabled=true;
    input.disabled=true;

    try{
      await push(ref(db,`chats/${chatId}/messages`),{
        text,
        sender:"agency",
        time:Date.now()
      });
      input.value="";
    }catch(error){
      console.error(error);
      alert("Message send nahi ho paya. Firebase Database Rules check karo.");
    }finally{
      button.disabled=false;
      input.disabled=false;
      input.focus();
    }
  });
}

function loadMessages(id){
  if(currentMessagesRef) off(currentMessagesRef);

  const box=$("messages");
  if(!box)return;

  if(!id){
    box.innerHTML='<div class="empty">No chat ID available for this application.</div>';
    return;
  }

  currentMessagesRef=ref(db,`chats/${id}/messages`);
  box.innerHTML="";

  onValue(currentMessagesRef,snapshot=>{
    const messages=snapshot.val()||{};
    box.innerHTML="";

    Object.entries(messages)
      .sort((a,b)=>(Number(a[1]?.time)||0)-(Number(b[1]?.time)||0))
      .forEach(([key,message])=>{
        if(!message)return;
        if(message.expiresAt && Date.now()>Number(message.expiresAt))return;

        const div=document.createElement("div");
        div.className="msg "+(message.sender==="agency"?"agency":"user");
        div.textContent=message.text||"";
        box.appendChild(div);
      });

    box.scrollTop=box.scrollHeight;

    const userCount=Object.values(messages).filter(m=>m&&m.sender==="user").length;
    $("chatCount").textContent=String(userCount);

    const stat=$("selectedMsgStat");
    if(stat)stat.textContent=String(userCount);
  },error=>{
    console.error(error);
    box.innerHTML='<div class="empty">Chat access error. Firebase Database Rules check karo.</div>';
  });
}
</script>
</body>
</html>
